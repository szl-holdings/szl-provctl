# SPDX-License-Identifier: Apache-2.0
# Drift guard for the vendored receipt chain.
#
# This kernel is a Hugging Face kernel-hub artifact: its import closure must stay
# stdlib + torch only (szl-kernels encodes that as test_hub_import_closure), so it
# cannot import the shared package at runtime, even behind a guard. The shared
# package szl-holdings/szl-evidence-core is the canonical implementation and this
# job proves on every change that torch-ext/szl_provctl/_chain.py still produces
# byte-identical digests, verdict tuples and exports. If it ever drifts, the PR
# that drifted it fails here, instead of a receipt verifying in one organ and
# failing in another.
name: chain-drift-guard

on:
  pull_request:
    paths:
      - "torch-ext/szl_provctl/_chain.py"
      - ".github/workflows/chain-drift-guard.yml"
  push:
    branches: [main]
    paths:
      - "torch-ext/szl_provctl/_chain.py"
      - ".github/workflows/chain-drift-guard.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compat:
    name: UnifiedReceiptChain byte-equality vs szl-evidence-core
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          check-latest: false

      - name: Install the canonical, pinned to a commit
        # Full SHA, not a tag: the canonical is what this file is measured
        # against, so it must not move underneath the measurement.
        run: python -m pip install "git+https://github.com/szl-holdings/szl-evidence-core@4c4e6e9b29cd717ce81ba44d9639caf0b37ff0bc"

      - name: Canonical passes its own gates first
        run: |
          python -m szl_evidence_core selftest
          python -m szl_evidence_core vectors

      - name: This repo's _chain.py is byte-equivalent to the canonical
        run: python -m szl_evidence_core compat "$GITHUB_WORKSPACE"
